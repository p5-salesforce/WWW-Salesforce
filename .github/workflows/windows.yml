name: windows
on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
  pull_request:
jobs:
  perl:
    runs-on: windows-latest
    strategy:
      fail-fast: true
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
      - name: Setup perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.42"
          distribution: strawberry
      - name: perl -V
        run: perl -V
      - name: Install working toolchain
        run: cpanm ExtUtils::Manifest App::cpanminus
      - name: Install Dependencies
        run: cpanm --installdeps .
      - name: Run Tests
        run: cpanm --test-only -v .
        env:
          SFDC_USER: ${{secrets.SFDC_USER}}
          SFDC_PASS: ${{secrets.SFDC_PASS}}
          SFDC_TOKEN: ${{secrets.SFDC_TOKEN}}
          SFDC_HOST: ${{secrets.SFDC_HOST}}
          SFDC_CLIENT_ID: ${{secrets.SFDC_CLIENT_ID}}
          SFDC_CLIENT_SECRET: ${{secrets.SFDC_CLIENT_SECRET}}
          SFDC_CC_CLIENT_ID: ${{secrets.SFDC_CC_CLIENT_ID}}
          SFDC_CC_CLIENT_SECRET: ${{secrets.SFDC_CC_CLIENT_SECRET}}
